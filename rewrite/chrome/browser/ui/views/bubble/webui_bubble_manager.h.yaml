substitutions:
  - description: |
      Make WebUIBubbleManagerImpl's overrides accessible to Brave subclasses.

      Brave subclasses WebUIBubbleManagerImpl and needs to reach
      CreateWebUIBubbleDialog and GetContentsWrapper, so promote them from
      private to protected.
    re_pattern: '(\n)(?=.*?CreateWebUIBubbleDialog\([^;{]*override;)'
    replace: |
      \1 protected:
  - description: |
      Restore private access after the promoted overrides.
    re_pattern: '(  WebUIContentsWrapper\* GetContentsWrapper\(\) override;\n)'
    replace: |
      \1 private:

substitutions:
  - description: |
      Cancel StarView::OnBubbleWidgetChanged with an early return.

    re_pattern: '(StarView::OnBubbleWidgetChanged\(.+?\) \{\n)'
    re_flags: [DOTALL]
    replace: |
      \1  return;

  - description: |
      Makes sure the view is never shown by calling SetVisible(false).

    re_pattern: '(StarView::UpdateImpl\(\) \{\n  bool enabled =)'
    re_flags: [DOTALL]
    replace: |-
      \1 false &&
